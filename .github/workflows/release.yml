# Release workflow using GoReleaser.
# Releases are cut by pushing a tag (e.g. `git tag -s v1.3.4 && git push origin v1.3.4`);
# GoReleaser creates the GitHub Release, builds the matrix, and uploads the assets.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # needed to create the GitHub Release + upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags → correct changelog/version

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
